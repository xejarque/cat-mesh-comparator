<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Observatorio MeshCore 868{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">Observatorio <span>MeshCore 868</span></a>
      <nav class="site">
        {% for href, label in nav %}
        <a href="{{ href }}"{% if active == href %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site">
    <div class="wrap">
      Datos del broker comunitario de Cataluña, en directo.
      {% if generated_at %}Consulta generada el {{ generated_at | ts }}.{% endif %}
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
